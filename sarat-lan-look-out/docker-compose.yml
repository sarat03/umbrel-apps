version: "3.7"

services:
  web:
    image: ghcr.io/sarat03/lanlookout:feae4a43d2800e304f8da62b1ea8ca4edc93e870@sha256:d343603b8cef874dbfd9917c150213ec82c14613927a6672b40b46d810fd80a6
    network_mode: "host"              # arp-scan must see the LAN
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      TZ: "America/New_York"
      HOST: "0.0.0.0"
      PORT: "8841"
    volumes:
      - ${APP_DATA_DIR}/data:/data/WatchYourLAN   # kept: existing hosts and history

version: "3.7"

services:
  web:
    image: ghcr.io/sarat03/lanlookout:988b40d33f496635afd10c81d422a740f01a2661@sha256:432d678dec9262d7ce9a24ecf4645e611109b1545b40ae797d4f3d1247c0183e
    network_mode: "host"              # arp-scan must see the LAN
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      TZ: "America/New_York"
      HOST: "0.0.0.0"
      PORT: "8841"
    volumes:
      - ${APP_DATA_DIR}/data:/data/WatchYourLAN   # kept: existing hosts and history

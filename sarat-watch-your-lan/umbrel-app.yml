manifestVersion: 1
id: sarat-watch-your-lan
storage:
  dataRoot: data
name: LanLookout
tagline: "Home network monitor: devices, internet health, security, DNS"
icon: https://raw.githubusercontent.com/sarat03/lanlookout/main/assets/logo.svg
category: networking
version: "0.1.0"
port: 8841
description: >-
  LanLookout keeps a list of every device on your network and works out what
  each one is. It alerts you to new devices, watched devices going offline,
  internet outages and risky open ports, and can show which sites each device
  uses via Pi-hole or AdGuard Home.


  If your devices don't appear, open Settings → Scanning and enter your network
  interface names (run `ip link show` in the Umbrel terminal to list them).
releaseNotes: "Renamed to LanLookout. New Internet and Security pages, device identification, alerts and DNS logs."
developer: sarat03
website: https://github.com/sarat03/lanlookout
submitter: sarat03
submission: https://github.com/sarat03/umbrel-apps
repo: https://github.com/sarat03/lanlookout
support: https://github.com/sarat03/lanlookout/issues
gallery: []
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""

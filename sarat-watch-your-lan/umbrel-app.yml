manifestVersion: 1
id: sarat-watch-your-lan
storage:
  dataRoot: data
name: WatchYourLAN (Sarat)
tagline: Network scanner with a redesigned, phone-friendly UI
icon: https://raw.githubusercontent.com/aceberg/WatchYourLAN/main/assets/logo.png
category: networking
version: "2.1.4-sarat.1"
port: 8841
description: >-
  WatchYourLAN keeps track of every device on your local network.


  This build adds a redesigned interface that works on phones, Add host and
  Scan now buttons, and better device names: names are retried on every scan
  and looked up over mDNS when your router's DNS has none.


  If your devices don't appear, open Settings → Scanning and enter your network
  interface names (run `ip link show` in the Umbrel terminal to list them),
  then save.
releaseNotes: ""
developer: aceberg (UI and naming changes by sarat03)
website: https://github.com/aceberg/WatchYourLAN
submitter: sarat03

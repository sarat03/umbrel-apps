version: "3.7"

services:
  web:
    image: ghcr.io/sarat03/lanlookout:5dd1264a3e1c0e9335644b1378c89c21ed0380f8@sha256:9d15fdaf5bc79ad1a5bd8a20bfbd0887cd3c258779bf277f561e9b840d18a0cb
    network_mode: "host"              # arp-scan must see the LAN
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      TZ: "America/New_York"
      HOST: "0.0.0.0"
      PORT: "8841"
    volumes:
      - ${APP_DATA_DIR}/data:/data/WatchYourLAN   # kept: existing hosts and history

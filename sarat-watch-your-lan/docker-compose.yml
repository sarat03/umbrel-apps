version: "3.7"

services:
  web:
    image: ghcr.io/sarat03/lanlookout:8235985a636832d3ade12c08cd122558aec4d1ff@sha256:1adb2a6fdcf62d343a1d046d5e262be5236ba7713578aa0a5c551f5e477cc898
    network_mode: "host"              # arp-scan must see the LAN
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      TZ: "America/New_York"
      HOST: "0.0.0.0"
      PORT: "8841"
    volumes:
      - ${APP_DATA_DIR}/data:/data/WatchYourLAN   # kept: existing hosts and history

version: "3.7"

services:
  web:
    image: ghcr.io/sarat03/lanlookout:1ff271865796c06a0f1345a1b4c06bbd4a9b1949@sha256:2aa56efd6fca05f9249437e82ed8b32116f1602edcfc07ee1dcf28405c92f21e
    network_mode: "host"              # arp-scan must see the LAN
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      TZ: "America/New_York"
      HOST: "0.0.0.0"
      PORT: "8841"
    volumes:
      - ${APP_DATA_DIR}/data:/data/WatchYourLAN   # kept: existing hosts and history

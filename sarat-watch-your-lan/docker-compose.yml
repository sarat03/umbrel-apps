version: "3.7"

services:
  web:
    # Private image: run `sudo docker login ghcr.io -u sarat03` on the Umbrel once.
    image: ghcr.io/sarat03/watchyourlan:latest
    network_mode: "host"              # arp-scan must see the LAN
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      TZ: "America/New_York"
      HOST: "0.0.0.0"
      PORT: "8841"                    # 8840 stays free for the official app
    volumes:
      - ${APP_DATA_DIR}/data:/data/WatchYourLAN

version: "3.7"

services:
  web:
    image: ghcr.io/sarat03/lanlookout:bbd737666d232429018bbdcccb411b2b632decc7@sha256:215d1359cb7444139b7f2d1c1843f69ce6d4a057b9d25a6049db7dc20574af4e
    network_mode: "host"              # arp-scan must see the LAN
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      TZ: "America/New_York"
      HOST: "0.0.0.0"
      PORT: "8841"
    volumes:
      - ${APP_DATA_DIR}/data:/data/WatchYourLAN   # kept: existing hosts and history
